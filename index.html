<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Status — vault.observer</title>
    <meta name="description" content="Real-time status page for Vault Authenticator services.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-card: #12121a;
            --bg-card-hover: #1a1a26;
            --border: #1e1e2e;
            --accent: #6c63ff;
            --accent-glow: rgba(108, 99, 255, 0.15);
            --green: #22c55e;
            --green-glow: rgba(34, 197, 94, 0.15);
            --red: #ef4444;
            --red-glow: rgba(239, 68, 68, 0.15);
            --yellow: #f59e0b;
            --yellow-glow: rgba(245, 158, 11, 0.15);
            --text-main: #e4e4ef;
            --text-muted: #8888a0;
            --text-dim: #555566;
            --radius: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            line-height: 1.6;
        }

        .page-bg {
            position: fixed; inset: 0; z-index: -1;
            background:
                radial-gradient(ellipse 60% 40% at 50% 0%, rgba(108, 99, 255, 0.06) 0%, transparent 70%),
                radial-gradient(ellipse 40% 30% at 80% 20%, rgba(34, 197, 94, 0.04) 0%, transparent 60%);
        }

        .container {
            max-width: 720px;
            margin: 0 auto;
            padding: 60px 20px 80px;
        }

        /* Header */
        .header {
            text-align: center;
            margin-bottom: 48px;
        }

        .header-logo {
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, var(--text-main) 0%, var(--text-muted) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Status Hero */
        .status-hero {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 28px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            margin-bottom: 32px;
            transition: all 0.4s ease;
        }

        .status-hero.online {
            border-color: rgba(34, 197, 94, 0.3);
            box-shadow: 0 0 30px var(--green-glow);
        }

        .status-hero.offline {
            border-color: rgba(239, 68, 68, 0.3);
            box-shadow: 0 0 30px var(--red-glow);
        }

        .status-hero.checking {
            border-color: rgba(245, 158, 11, 0.3);
            box-shadow: 0 0 30px var(--yellow-glow);
        }

        .status-dot {
            width: 14px; height: 14px;
            border-radius: 50%;
            background: var(--yellow);
            animation: pulse 1.5s ease-in-out infinite;
            flex-shrink: 0;
        }

        .status-hero.online .status-dot { background: var(--green); }
        .status-hero.offline .status-dot { background: var(--red); }
        .status-hero.checking .status-dot { background: var(--yellow); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.85); }
        }

        .status-text {
            font-size: 1.1rem;
            font-weight: 600;
        }

        .status-hero.online .status-text { color: var(--green); }
        .status-hero.offline .status-text { color: var(--red); }
        .status-hero.checking .status-text { color: var(--yellow); }

        .status-meta {
            font-size: 0.78rem;
            color: var(--text-dim);
            text-align: center;
            margin-top: -20px;
            margin-bottom: 32px;
        }

        /* Services Grid */
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-dim);
            margin-bottom: 14px;
        }

        .services {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 40px;
        }

        .service-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            transition: background 0.2s;
        }

        .service-row:hover { background: var(--bg-card-hover); }

        .service-name {
            font-weight: 500;
            font-size: 0.92rem;
        }

        .service-badge {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-ok { background: var(--green-glow); color: var(--green); }
        .badge-down { background: var(--red-glow); color: var(--red); }
        .badge-checking { background: var(--yellow-glow); color: var(--yellow); }

        /* Response time */
        .response-time {
            font-size: 0.78rem;
            color: var(--text-dim);
            margin-left: auto;
            margin-right: 12px;
        }

        /* Messages / Issues */
        .messages {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }

        .message-card {
            padding: 18px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            border-left: 3px solid var(--text-dim);
        }

        .message-card.issue { border-left-color: var(--red); }
        .message-card.warning { border-left-color: var(--yellow); }
        .message-card.resolved { border-left-color: var(--green); }
        .message-card.info { border-left-color: var(--accent); }

        .message-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .message-type {
            font-size: 0.68rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .message-card.issue .message-type { background: var(--red-glow); color: var(--red); }
        .message-card.warning .message-type { background: var(--yellow-glow); color: var(--yellow); }
        .message-card.resolved .message-type { background: var(--green-glow); color: var(--green); }
        .message-card.info .message-type { background: var(--accent-glow); color: var(--accent); }

        .message-date {
            font-size: 0.72rem;
            color: var(--text-dim);
        }

        .message-title {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 4px;
        }

        .message-body {
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .no-messages {
            text-align: center;
            padding: 24px;
            color: var(--text-dim);
            font-size: 0.85rem;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding-top: 32px;
            border-top: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.78rem;
        }

        .footer a {
            color: var(--accent);
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .container { padding: 40px 16px 60px; }
            .header h1 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="page-bg"></div>
    <div class="container">
        <div class="header">
            <div class="header-logo">Vault Observer</div>
            <h1>System Status</h1>
            <p>Real-time health monitoring for Vault services</p>
        </div>

        <div id="status-hero" class="status-hero checking">
            <div class="status-dot"></div>
            <span class="status-text">Checking status...</span>
        </div>
        <div id="status-meta" class="status-meta"></div>

        <div class="section-title">Services</div>
        <div id="services" class="services">
            <div class="service-row">
                <span class="service-name">API Server</span>
                <span id="api-response-time" class="response-time"></span>
                <span id="api-badge" class="service-badge badge-checking">Checking</span>
            </div>
            <div class="service-row">
                <span class="service-name">WebSocket Endpoint</span>
                <span id="ws-response-time" class="response-time"></span>
                <span id="ws-badge" class="service-badge badge-checking">Checking</span>
            </div>
        </div>

        <div class="section-title">Messages</div>
        <div id="messages" class="messages">
            <div class="no-messages">Loading messages...</div>
        </div>

        <div class="footer">
            <p>vault.observer &mdash; Checked every 30 seconds while this page is open</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://api.vault.observer';

        // Health check
        async function checkHealth() {
            const hero = document.getElementById('status-hero');
            const meta = document.getElementById('status-meta');
            const apiBadge = document.getElementById('api-badge');
            const apiTime = document.getElementById('api-response-time');
            const wsBadge = document.getElementById('ws-badge');
            const wsTime = document.getElementById('ws-response-time');

            let apiOk = false;
            let wsOk = false;
            let latencyMs = 0;

            // Test API /health
            try {
                const start = performance.now();
                const res = await fetch(`${API_URL}/health`, { signal: AbortSignal.timeout(8000) });
                latencyMs = Math.round(performance.now() - start);
                if (res.ok) {
                    const data = await res.json();
                    apiOk = data.status === 'ok';
                }
            } catch (e) { apiOk = false; }

            apiBadge.textContent = apiOk ? 'Operational' : 'Down';
            apiBadge.className = `service-badge ${apiOk ? 'badge-ok' : 'badge-down'}`;
            apiTime.textContent = apiOk ? `${latencyMs}ms` : '';

            // Test WebSocket
            try {
                wsOk = await new Promise((resolve) => {
                    const wsStart = performance.now();
                    const ws = new WebSocket(`${API_URL.replace('https', 'wss')}/ws`);
                    const timeout = setTimeout(() => { ws.close(); resolve(false); }, 8000);
                    ws.onopen = () => {
                        const wsLatency = Math.round(performance.now() - wsStart);
                        wsTime.textContent = `${wsLatency}ms`;
                        clearTimeout(timeout);
                        ws.close();
                        resolve(true);
                    };
                    ws.onerror = () => { clearTimeout(timeout); resolve(false); };
                });
            } catch (e) { wsOk = false; }

            wsBadge.textContent = wsOk ? 'Operational' : 'Down';
            wsBadge.className = `service-badge ${wsOk ? 'badge-ok' : 'badge-down'}`;

            const allOk = apiOk && wsOk;
            hero.className = `status-hero ${allOk ? 'online' : 'offline'}`;
            hero.querySelector('.status-text').textContent = allOk ? 'All Systems Operational' : 'Service Disruption Detected';

            const now = new Date();
            meta.textContent = `Last checked: ${now.toLocaleTimeString()} — ${apiOk ? `API responded in ${latencyMs}ms` : 'API unreachable'}`;
        }

        // Load status messages
        async function loadMessages() {
            const container = document.getElementById('messages');
            try {
                const res = await fetch('status.json?' + Date.now());
                const messages = await res.json();

                if (!messages.length) {
                    container.innerHTML = '<div class="no-messages">No current issues — all clear! ✨</div>';
                    return;
                }

                // Sort newest first
                messages.sort((a, b) => new Date(b.date) - new Date(a.date));

                container.innerHTML = messages.map(msg => `
                    <div class="message-card ${msg.type}">
                        <div class="message-header">
                            <span class="message-type">${msg.type}</span>
                            <span class="message-date">${msg.date}</span>
                        </div>
                        <div class="message-title">${escapeHtml(msg.title)}</div>
                        <div class="message-body">${escapeHtml(msg.message)}</div>
                    </div>
                `).join('');
            } catch (e) {
                container.innerHTML = '<div class="no-messages">Unable to load messages</div>';
            }
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // Initial check + interval
        checkHealth();
        loadMessages();
        setInterval(checkHealth, 30000);
        setInterval(loadMessages, 60000);
    </script>
</body>
</html>
